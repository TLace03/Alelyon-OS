# Release `alelyon-os` from TLace03/Alelyon-OS via Trusted Publishing (OIDC).
#
# ─────────────────────────────────────────────────────────────────────────────────
# THIS FILE DOES NOT LIVE HERE. Copy it to the PUBLIC repository as
#
#     Alelyon-OS/.github/workflows/release.yml
#
# The filename is load-bearing and must be exactly `release.yml`: PyPI matches a
# trusted publisher on the repository AND the workflow FILENAME. A publisher
# registered for `release.yml` will reject a run of `publish.yml`, and the error
# arrives as `invalid-publisher`, which reads like a credentials problem and is not.
#
# It is staged in the private monorepo rather than written straight into the public
# repo because the public tree is GENERATED (`tools/export_public_os.py`) and this is
# the reviewed source of the one file in it that holds release authority. Folding it
# into the generated export is a sensible follow-up and is deliberately not done here:
# it changes the export contract and its tests.
# ─────────────────────────────────────────────────────────────────────────────────
#
# PRODUCTION PUBLICATION IS ARMED OUTSIDE THIS FILE, and remains TWO-GATED.
#
# The predecessor workflow shipped with no production job at all, on the stated
# grounds that historical revisions and external trusted-publisher/environment
# controls are a release stop-ship until an administrator hardens them independently.
# That posture is preserved: the production job below exists, but it runs only when
#
#   1. a repository variable `ALELYON_OS_PRODUCTION_RELEASE` is set to `enabled`, and
#   2. a GitHub Environment named `pypi` exists WITH REQUIRED REVIEWERS.
#
# Neither control is set by this file. Observed 2026-08-13, the repository variable is
# enabled and the `pypi` environment has a required reviewer, so a matching release tag
# can reach the approval gate. Those are mutable repository settings, not properties of
# this source: inspect them before every release. If either is absent, tagging produces
# a validated artifact and stops without publishing.
#
# THE PROJECT-LEVEL PUBLISHER ON PyPI:
#
#   Owner            TLace03
#   Repository name  Alelyon-OS
#   Workflow name    release.yml
#   Environment      pypi   (or leave blank to match any)
#
# `alelyon-os` now exists on PyPI, so a pending publisher cannot authorize an upload.
# Only the publisher on the project's own settings page is matched:
#
#   https://pypi.org/manage/project/alelyon-os/settings/publishing/
#
# Run `tools/pypi_oidc_preflight.py --index pypi --dist-name alelyon-os` in the
# monorepo to re-check which registration kind governs, with no credentials. The
# workflow's publish step remains the authoritative test of the registered tuple.
#
# NO TESTPYPI REHEARSAL (removed 2026-08-03, owner decision). There was one, and it
# cost four runs to `invalid-publisher` with a claim set that was correct in every
# field. The cause is structural rather than a misconfiguration: test.pypi.org is a
# SEPARATE SERVICE from pypi.org, with its own account, its own login and its own
# publisher list, so rehearsing there means standing up and maintaining a second
# registration whose only job is to rehearse. That is a real cost for a step that
# proves nothing about the production credential path it is standing in for.
#
# What replaces it is honest about its own limits: `workflow_dispatch` builds,
# validates, rebuilds the wheel from its own sdist and smoke-tests every subsystem
# from a clean install — then stops, holding no `id-token` permission at all. It
# exercises everything up to the index and nothing at it. Only a tagged release makes
# an OIDC exchange with PyPI, and the two production controls still stand between a
# mistake and a published artifact.

name: Release

on:
  push:
    tags:
      - "alelyon-os-v*"
  # Manual dispatch is a DRY RUN: it builds, validates and smoke-tests the artifact
  # and then stops without a publish target. It takes no inputs, because there is
  # nothing left to choose — see the TestPyPI note in the header.
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PACKAGE: alelyon-os
  PKG_DIR: packages/alelyon-os

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: validate release authority and source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - id: resolve
        name: Resolve the version and index target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version comes from the MANIFEST, never from the tag: a tag is a label a
          # human typed, and letting it name the version means a typo publishes a
          # version nothing in the tree declares.
          version="$(python -c "
          import re,pathlib
          t=pathlib.Path('${PKG_DIR}/pyproject.toml').read_text(encoding='utf-8')
          m=re.search(r'^version = \"([^\"]+)\"', t, re.M)
          assert m, 'pyproject declares no version'
          print(m.group(1))")"
          if [ "$EVENT" = "push" ]; then
            tag_version="${REF_NAME#alelyon-os-v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag ${REF_NAME} does not match the declared version ${version}"
              exit 1
            fi
            target=pypi
          else
            # A dispatch validates and stops. `none` is a real target value, not an
            # empty string: an unset output compares equal to every typo'd `if:`
            # condition, and a publish job guarded by one would run.
            target=none
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "resolved ${PACKAGE} ${version} -> ${target}"

      - name: Require an annotated tag reachable from origin/main
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/*:refs/tags/*"
          # An annotated tag carries a tagger and can be signed; a lightweight tag is
          # just a moveable pointer, so requiring the object type is what makes "who
          # cut this release" answerable afterwards.
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::release tags must be annotated tag objects"
            exit 1
          fi
          event_commit="$(git rev-parse --verify --end-of-options "${SHA}^{commit}")"
          tag_commit="$(git rev-parse --verify --end-of-options "refs/tags/${TAG}^{commit}")"
          if [ "$tag_commit" != "$event_commit" ]; then
            echo "::error::release tag does not resolve to the triggering commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::release tag commit is not reachable from origin/main"
            exit 1
          fi

      # PyPI filenames are immutable: once alelyon_os-<v>.tar.gz has been uploaded,
      # no run can ever upload that version again, and without this step the refusal
      # arrives as `400 File already exists` AFTER the build, the attestations, and
      # the environment approval. Measured 2026-08-06: a duplicate push of
      # alelyon-os-v0.2.0 spent 5h34m (mostly waiting for a human to approve the
      # `pypi` environment) reaching an upload that could never have succeeded.
      # Asking the index first costs one credential-free JSON request and turns that
      # into a 30-second refusal that names the fix.
      #
      # Fail-closed only on a definitive "these files exist" answer. A 404 is the
      # first-release case, and an unreachable index must not veto a legitimate
      # release here - the upload step settles that authoritatively either way.
      - name: Refuse a version PyPI already serves
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python - "$VERSION" <<'EOF'
          import json, sys, urllib.error, urllib.request
          version = sys.argv[1]
          url = f"https://pypi.org/pypi/alelyon-os/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  files = json.load(response).get("urls", [])
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"alelyon-os {version} is not on PyPI; proceeding")
                  sys.exit(0)
              print(f"::warning::PyPI answered {exc.code} for {url}; "
                    "letting the upload step decide")
              sys.exit(0)
          except OSError as exc:
              print(f"::warning::could not reach PyPI ({exc}); "
                    "letting the upload step decide")
              sys.exit(0)
          if files:
              names = ", ".join(sorted(f["filename"] for f in files))
              print(f"::error::alelyon-os {version} is already on PyPI ({names}), "
                    "and PyPI filenames are immutable, so this run can never "
                    "publish. Bump version in packaging/alelyon-os/pyproject.toml "
                    "in the private monorepo, re-export the mirror, and push a new "
                    "annotated alelyon-os-v<version> tag.")
              sys.exit(1)
          print(f"alelyon-os {version} exists on PyPI with no files; proceeding")
          EOF

  build:
    name: build and check alelyon-os
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      # `setuptools` is NOT optional here, and its absence is not obvious.
      #
      # Python 3.12 dropped setuptools from `ensurepip`, so a fresh interpreter no
      # longer has it. Every build step below runs WITHOUT build isolation, which
      # means pip does not create a scratch environment from
      # `build-system.requires` -- it uses whatever is installed here. Miss it and
      # the failure is `BackendUnavailable: Cannot import 'setuptools.build_meta'`,
      # thrown from deep inside pip's resolver with no mention of the real cause.
      #
      # Isolation is off deliberately rather than by inheritance: the sdist-rebuild
      # step runs `--no-index` to prove the sdist is self-contained, and an isolated
      # build there would need to fetch its backend from the index that flag just
      # blocked. One mode everywhere beats two that differ per step.
      #
      # The floor matches `build-system.requires` in the package's own manifest;
      # PEP 639 `license-files` needs >= 77.
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=77" wheel build
          python -c "import setuptools; print('setuptools', setuptools.__version__)"

      # Test THIS tree, from the exported source, before anything is built from it.
      #
      # Installed WITH its dependencies, deliberately. The predecessor workflow used
      # `--no-deps` because it published three interdependent distributions and the
      # flag stopped pip satisfying one of them from the index instead of from the
      # local path. `alelyon-os` is a single distribution with no such sibling, so
      # here `--no-deps` bought nothing and cost the whole check: the runtime
      # dependencies were never installed and every test errored at collection on
      # `ModuleNotFoundError: No module named 'numpy'`.
      #
      # Resolving them properly also makes this step assert something it could not
      # before -- that `dependencies` in the manifest is COMPLETE. A module that
      # imports something the manifest forgot now fails here rather than on a user's
      # machine. `[dev]` adds pytest and httpx on top.
      - name: Test the tree being released
        run: |
          python -m pip install --no-build-isolation -e "${PKG_DIR}[dev]"
          python -m pytest "${PKG_DIR}/tests" -q

      - name: Build wheel and sdist
        run: python -m build --no-isolation --outdir dist "${PKG_DIR}"

      - name: Validate artifact identity
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          stem="alelyon_os-${VERSION}"
          test -f "dist/${stem}-py3-none-any.whl" || { echo "::error::missing wheel"; exit 1; }
          test -f "dist/${stem}.tar.gz"            || { echo "::error::missing sdist"; exit 1; }
          # Exactly two files. A third would be published alongside them unnoticed.
          count="$(find dist -type f | wc -l)"
          test "$count" -eq 2 || { echo "::error::expected 2 artifacts, found ${count}"; find dist -type f; exit 1; }

      # Rebuilding the wheel FROM the sdist is what catches an sdist that omits a file
      # the wheel had. Users who install from source get the sdist, so an sdist that
      # cannot produce the wheel is a broken release that a wheel-only check passes.
      - name: Rebuild the wheel from its own sdist
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sdist-rebuild
          python -m pip wheel --no-index --no-cache-dir --no-deps \
            --no-build-isolation --wheel-dir sdist-rebuild "dist/alelyon_os-${VERSION}.tar.gz"
          test -f "sdist-rebuild/alelyon_os-${VERSION}-py3-none-any.whl"

      - name: Exercise every subsystem from the built wheel, with the repo unreachable
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PYTHONPATH: ""
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          python -m venv smoke
          smoke/bin/python -m pip install --quiet \
            "dist/alelyon_os-${VERSION}-py3-none-any.whl[sdk,stream]"
          cd /tmp
          # One import per subsystem. A missing allowlist entry surfaces here and
          # nowhere earlier, because here is the first place the source tree is gone.
          "$GITHUB_WORKSPACE/smoke/bin/python" -c "
          import alelyon.verify
          import alelyon.runtime.vector.lattice
          from alelyon.runtime.vector.lattice import morphometry
          from alelyon.runtime.common import worktree, worktree_cache
          import alelyon.runtime.vector.compute
          from alelyon.platform.sdk import AlelyonClient
          print('every subsystem imports from the installed wheel')"
          "$GITHUB_WORKSPACE/smoke/bin/alelyon-verify" selftest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-alelyon-os-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  dry-run-complete:
    name: validated, nothing published
    if: needs.resolve.outputs.target == 'none'
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      # Says what was and was NOT established. A manual run that ends green with no
      # further comment reads as "the release works", and it does not: this exercises
      # everything up to the index and nothing at it.
      - name: Report what a dispatch does and does not prove
        run: |
          echo "::notice::alelyon-os ${{ needs.resolve.outputs.version }} built,"               "validated, rebuilt from its own sdist and smoke-tested from a clean"               "install. NOTHING WAS PUBLISHED and no index credential was requested"               "- this run holds no id-token permission at all. Publishing requires an"               "annotated alelyon-os-v* tag reachable from main, plus both production"               "switches. The artifact is attached to this run for inspection."

  publish-pypi:
    name: publish to PyPI
    # BOTH conditions are required, and neither is set by this file. See the header.
    if: >-
      needs.resolve.outputs.target == 'pypi' &&
      vars.ALELYON_OS_PRODUCTION_RELEASE == 'enabled'
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    environment:
      # This environment must exist WITH REQUIRED REVIEWERS. Without that repository
      # setting the source cannot promise human approval; inspect it before tagging.
      name: pypi
      url: https://pypi.org/p/alelyon-os
    permissions:
      contents: read
      id-token: write
    steps:
      # A PARTIAL checkout, for the preflight script only.
      #
      # These jobs hold `id-token: write` — the one permission that can mint an
      # index credential — so the less present in them the better. Before this they
      # checked out nothing at all, which was correct for publishing (the artifact
      # arrives from `build`) and broke the moment a step referenced a repo file:
      # `bash: .github/publisher-preflight.sh: No such file or directory`, exit 127.
      #
      # So: `.github` only, and `persist-credentials: false` so no git credential is
      # left sitting beside the OIDC token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-alelyon-os-${{ github.sha }}
          path: dist/

      - name: Which registration must authorize this upload
        env:
          INDEX_HOST: pypi.org
          TARGET_ENVIRONMENT: pypi
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publisher-preflight.sh

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
          # PEP 740 attestations, signed by this workflow run. PLATFORM.md §W1(c)
          # requires them: a party asked to check a hash "against the release" is
          # otherwise checking a number the issuer alone controls.
          attestations: true

  production-gate-closed:
    name: production publication is gated off
    if: >-
      needs.resolve.outputs.target == 'pypi' &&
      vars.ALELYON_OS_PRODUCTION_RELEASE != 'enabled'
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Report the fail-closed gate
        run: >-
          echo "::notice::artifacts passed every release check, and production
          publication is gated off. Set the repository variable
          ALELYON_OS_PRODUCTION_RELEASE=enabled and create a 'pypi' environment with
          required reviewers to enable it."
